<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 챗봇</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #f0f2f5;
      }

      #header {
        padding: 12px 16px;
        background: white;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #header select {
        padding: 6px 10px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      #chatContainer {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        max-width: 72%;
        padding: 10px 14px;
        border-radius: 18px;
        line-height: 1.6;
        font-size: 15px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message.user {
        align-self: flex-end;
        background: #0084ff;
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message.assistant {
        align-self: flex-start;
        background: white;
        color: #1a1a1a;
        border: 1px solid #e8e8e8;
        border-bottom-left-radius: 4px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      }

      .message.assistant:empty::after {
        content: "▋";
        animation: blink 0.8s step-start infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      #inputArea {
        padding: 12px 16px;
        background: white;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #askInput {
        flex: 1;
        padding: 10px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 24px;
        outline: none;
        font-size: 15px;
        transition: border-color 0.2s;
      }

      #askInput:focus {
        border-color: #0084ff;
      }

      #sendBtn {
        padding: 10px 20px;
        background: #0084ff;
        color: white;
        border: none;
        border-radius: 24px;
        cursor: pointer;
        font-size: 15px;
        transition: background 0.2s;
      }

      #sendBtn:hover:not(:disabled) {
        background: #006fe6;
      }

      #sendBtn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <select id="provider">
        <option>google</option>
        <option>groq</option>
      </select>
      <select id="model">
        <option>gemma-4-26b-a4b-it</option>
        <option>openai/gpt-oss-120b</option>
      </select>
    </div>

    <div id="chatContainer"></div>

    <div id="inputArea">
      <input id="askInput" placeholder="메시지를 입력하세요..." />
      <button id="sendBtn">전송</button>
    </div>

    <script>
      const chatContainer = document.querySelector("#chatContainer");
      const askInput = document.querySelector("#askInput");
      const sendBtn = document.querySelector("#sendBtn");
      const providerSelect = document.querySelector("#provider");
      const modelSelect = document.querySelector("#model");

      // 대화 히스토리 — 브라우저 메모리에 보관
      const messages = [];

      const providerModelMap = {
        google: "gemma-4-26b-a4b-it",
        groq: "openai/gpt-oss-120b",
      };

      providerSelect.addEventListener("change", () => {
        modelSelect.value = providerModelMap[providerSelect.value];
      });

      function addBubble(role, content) {
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.textContent = content;
        chatContainer.append(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
      }

      async function sendMessage() {
        const ask = askInput.value.trim();
        if (!ask) return;

        askInput.value = "";
        sendBtn.disabled = true;

        messages.push({ role: "user", content: ask });
        addBubble("user", ask);

        // 빈 말풍선 먼저 생성 — 커서 깜빡임 CSS가 적용됨
        const bubble = addBubble("assistant", "");
        let fullText = "";

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              provider: providerSelect.value,
              model: modelSelect.value,
              messages,
            }),
          });

          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          outer: while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            for (const line of decoder.decode(value).split("\n")) {
              if (!line.startsWith("data: ")) continue;
              const data = line.slice(6);
              if (data === "[DONE]") break outer;
              try {
                const { chunk, error } = JSON.parse(data);
                if (error) throw new Error(error);
                fullText += chunk;
                bubble.textContent = fullText;
                chatContainer.scrollTop = chatContainer.scrollHeight;
              } catch {}
            }
          }

          messages.push({ role: "assistant", content: fullText });
        } catch (err) {
          bubble.textContent = "오류가 발생했습니다. 다시 시도해주세요.";
          messages.pop();
        }

        sendBtn.disabled = false;
        askInput.focus();
      }

      sendBtn.addEventListener("click", sendMessage);
      askInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          sendMessage();
        }
      });
    </script>
  </body>
</html>
